<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP | Calculator</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <main>
        <div class="calculator">
            <p class="display" id="display">0</p>
            <div class="button container">
                <button class="special-button" id="ac">AC</button>
                <button class="special-button" id="modulo">%</button>
                <button class="special-button" id="del">del</button>
                <button class="operator-button" id="divide">/</button>
                <button class="num-button" id="7">7</button>
                <button class="num-button" id="8">8</button>
                <button class="num-button" id="9">9</button>
                <button class="operator-button" id="multiply">x</button>
                <button class="num-button" id="4">4</button>
                <button class="num-button" id="5">5</button>
                <button class="num-button" id="6">6</button>
                <button class="operator-button" id="minus">-</button>
                <button class="num-button" id="1">1</button>
                <button class="num-button" id="2">2</button>
                <button class="num-button" id="3">3</button>
                <button class="operator-button" id="plus">+</button>
                <button class="special-button" id="logo">logo</button>
                <button class="num-button" id="0">0</button>
                <button class="comma-button" id="comma">.</button>
                <button class="equal-button" id="equal">=</button>
            </div>
        </div>
    </main>
</body>
</html>
