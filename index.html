<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP | Calculator</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>
<body>
    <main>
        <div class="calculator">
            <p class="small display"></p>
            <p class="main display"></p>
            <div class="button container">
                <button class="clear-button">AC</button>
                <button class="special-button" id="modulo">%</button>
                <button class="special-button" id="del">del</button>
                <button class="operator-button" id="divide">÷</button>
                <button class="num-button">7</button>
                <button class="num-button">8</button>
                <button class="num-button">9</button>
                <button class="operator-button" id="multiply">×</button>
                <button class="num-button">4</button>
                <button class="num-button">5</button>
                <button class="num-button">6</button>
                <button class="operator-button" id="minus">-</button>
                <button class="num-button">1</button>
                <button class="num-button">2</button>
                <button class="num-button">3</button>
                <button class="operator-button" id="plus">+</button>
                <img class="logo" src="">
                <button class="num-button">0</button>
                <button class="comma-button">.</button>
                <button class="equal-button" id="equal">=</button>
            </div>
        </div>
    </main>
</body>
</html>
